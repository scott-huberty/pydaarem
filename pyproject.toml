[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydaarem"
version = "0.1.0"
description = "Python interpretation of DAAREM fixed-point acceleration"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
]
authors = [
    { name = "pydaarem contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.setuptools]
packages = ["pydaarem"]
package-dir = { pydaarem = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.numpydoc_validation]
checks = ["all", "ES01", "SA01"]
exclude = ['\._']

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
numpy = ">=1.23"

[tool.pixi.pypi-dependencies]
pydaarem = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
scipy = "*"
rpy2 = "*"
r-base = "*"

# On Windows, embedded R loads its DLLs through PATH. Put this environment's R
# first, so that the runner's system R is not used.
[tool.pixi.feature.test.target.win-64.activation.env]
R_HOME = "%CONDA_PREFIX%\\Lib\\R"
PATH = "%CONDA_PREFIX%\\Lib\\R\\bin\\x64;%PATH%"

[tool.pixi.feature.test.tasks]
install-r-daarem = "Rscript tests/install_r_deps.R"
test = { cmd = "pytest", depends-on = ["install-r-daarem"] }

[tool.pixi.feature.lint.dependencies]
pre-commit = "*"

[tool.pixi.feature.lint.tasks]
lint = "pre-commit run --all-files"

[tool.pixi.environments]
default = ["test"]
lint = { features = ["lint"], no-default-feature = true }
