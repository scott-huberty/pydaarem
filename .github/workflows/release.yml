name: Release

# Push a tag "v<version>" on main to publish that version on PyPI. The tag
# must match the version in pyproject.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: check that the wheel installs and has the tag version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/python -c "import os, pydaarem; assert 'v' + pydaarem.__version__ == os.environ['TAG'], pydaarem.__version__"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pydaarem
    permissions:
      # PyPI trusted publishing uses an OpenID Connect token, not a password.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
