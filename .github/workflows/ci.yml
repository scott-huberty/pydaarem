name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.openblas-coretype && format(', {0}', matrix.openblas-coretype) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        openblas-coretype: [""]
        # OpenBLAS selects its kernel from the runner CPU, and the kernel changes
        # rounding. Pin two kernels that differ from the usual runner kernel, so
        # that tests near a decision boundary fail on every run.
        include:
          - os: ubuntu-latest
            openblas-coretype: SandyBridge
          - os: ubuntu-latest
            openblas-coretype: Prescott
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_CORETYPE: ${{ matrix.openblas-coretype }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.59.0
          environments: default
          cache: true
      - run: pixi run test -rA

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.59.0
          environments: lint
          cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: ruff check
        run: pixi run -e lint pre-commit run ruff-check --all-files
      - name: ruff format
        run: pixi run -e lint pre-commit run ruff-format --all-files
      - name: numpydoc
        run: pixi run -e lint pre-commit run numpydoc-validation --all-files
